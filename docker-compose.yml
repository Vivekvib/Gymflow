services:
  postgres:
    image: postgres:16
    container_name: gymflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gymflow
    ports:
      - "5432:5432"
    volumes:
      - gymflow-postgres-data:/var/lib/postgresql/data

volumes:
  gymflow-postgres-data:
